<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure PDF Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0f0f11;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #gate {
    width: 90%;
    max-width: 380px;
    text-align: center;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 1.5rem;
    color: #fff;
    letter-spacing: 0.02em;
  }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 14px 44px 14px 16px;
    font-size: 1rem;
    border: 1px solid #2a2a2e;
    border-radius: 10px;
    background: #18181b;
    color: #f0f0f0;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: #7c5cff;
    box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
  }
  .eye-btn {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a1a1aa;
    transition: color 0.2s;
  }
  .eye-btn:hover { color: #fff; }
  .eye-btn svg { width: 20px; height: 20px; }
  button#unlock {
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 500;
    color: #fff;
    background: #7c5cff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button#unlock:hover { background: #654ce0; }
  button#unlock:active { transform: scale(0.98); }
  #status {
    margin-top: 12px;
    font-size: 0.95rem;
    min-height: 1.4em;
    color: #ff5c5c;
  }
  #viewer {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
  }
  #viewer iframe {
    flex: 1;
    border: none;
    width: 100%;
    height: 100%;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="gate">
  <h1>Enter Password</h1>
  <div class="input-wrap">
    <input id="pw" type="password" placeholder="Password" autocomplete="off" />
    <button class="eye-btn" id="eye" type="button" aria-label="Show password">
      <svg id="icon-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <svg id="icon-shown" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
    </button>
  </div>
  <button id="unlock">Unlock PDF</button>
  <div id="status"></div>
</div>

<div id="viewer">
  <iframe id="pdf-frame" title="PDF"></iframe>
</div>

  async function deriveKey(password) {
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function tryUnlock(password) {
    try {
      const key = await deriveKey(password);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
      return new Blob([plain], { type: "application/pdf" });
    } catch (e) {
      return null;
    }
  }

  const pwInput = document.getElementById("pw");
  const eyeBtn  = document.getElementById("eye");
  const iconHid = document.getElementById("icon-hidden");
  const iconSho = document.getElementById("icon-shown");
  const unlock  = document.getElementById("unlock");
  const status  = document.getElementById("status");
  const gate    = document.getElementById("gate");
  const viewer  = document.getElementById("viewer");
  const frame   = document.getElementById("pdf-frame");

  let showing = false;
  eyeBtn.addEventListener("click", () => {
    showing = !showing;
    pwInput.type = showing ? "text" : "password";
    iconHid.classList.toggle("hidden", showing);
    iconSho.classList.toggle("hidden", !showing);
  });

  pwInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") unlock.click();
  });

  unlock.addEventListener("click", async () => {
    status.textContent = "";
    const blob = await tryUnlock(pwInput.value);
    if (!blob) {
      status.textContent = "not rlly";
      return;
    }
    const url = URL.createObjectURL(blob);
    frame.src = url;
    gate.style.display = "none";
    viewer.style.display = "flex";
  });
})();
